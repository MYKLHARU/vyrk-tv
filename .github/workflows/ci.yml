name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check string resources
        run: python tools/gen_strings.py --check

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then NAME="${GITHUB_REF_NAME#v}"; else NAME="0.1.0-ci.${GITHUB_RUN_NUMBER}"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Release signing (only when the owner has added the secrets)
        env:
          VYRK_KEYSTORE_B64: ${{ secrets.VYRK_KEYSTORE_B64 }}
        run: |
          if [[ -n "$VYRK_KEYSTORE_B64" ]]; then
            echo "$VYRK_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "VYRK_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=release" >> "$GITHUB_ENV"
          else
            echo "No signing secrets: APKs are signed with the committed debug key (ci/debug-signing, NOT secret, testing only)."
            echo "SIGNED=debug" >> "$GITHUB_ENV"
          fi

      - name: Unit tests and release APKs
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          VYRK_KEYSTORE_PASSWORD: ${{ secrets.VYRK_KEYSTORE_PASSWORD }}
          VYRK_KEY_ALIAS: ${{ secrets.VYRK_KEY_ALIAS }}
          VYRK_KEY_PASSWORD: ${{ secrets.VYRK_KEY_PASSWORD }}
        run: >
          ./gradlew --stacktrace :core:test :app:assembleRelease
          -Pvyrk.versionName=${{ steps.version.outputs.name }}
          -Pvyrk.versionCode=${{ steps.version.outputs.code }}

      - name: Collect artifacts
        run: |
          mkdir -p dist
          V=${{ steps.version.outputs.name }}
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            cp "app/build/outputs/apk/release/app-$abi-release.apk" "dist/vyrk-$V-$abi.apk"
          done
          cp app/build/outputs/mapping/release/mapping.txt "dist/vyrk-$V-mapping.txt"
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -l dist

      - uses: actions/upload-artifact@v5
        with:
          name: apks
          path: dist/
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: unit-test-report
          path: core/build/reports/tests/

      - name: Publish ci-latest pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ci-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create ci-latest dist/* --prerelease --target "$GITHUB_SHA" \
            --title "Latest CI build (${{ steps.version.outputs.name }})" \
            --notes "Automatic build of $GITHUB_SHA. Signed with: $SIGNED key. Not a release."

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$SIGNED" != release ]]; then
            echo "::error::Refusing to publish a versioned release without the real signing secrets (VYRK_KEYSTORE_B64, VYRK_KEYSTORE_PASSWORD, VYRK_KEY_ALIAS, VYRK_KEY_PASSWORD)."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "VYRK $GITHUB_REF_NAME" --notes-file CHANGELOG.md

  e2e:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: apks
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Media for the test add-on
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p ci/media
          ffmpeg -loglevel error -y -f lavfi -i testsrc2=size=1280x720:rate=25 -f lavfi -i sine=frequency=440:sample_rate=48000 \
            -t 600 -c:v libx264 -pix_fmt yuv420p -preset ultrafast -crf 32 -c:a aac -b:a 64k -movflags +faststart ci/media/sample-720p.mp4
          ffmpeg -loglevel error -y -ss 0 -t 150 -i https://archive.org/download/BigBuckBunny_124/Content/big_buck_bunny_720p_surround.mp4 \
            -c copy -movflags +faststart ci/media/bbb-clip.mp4 || echo "BBB clip unavailable; search playback uses the generated sample"
      - name: Start the test add-on
        run: |
          mkdir -p ci/out/e2e
          nohup python3 ci/test_addon.py > ci/out/e2e/addon.log 2>&1 &
          sleep 3 && curl -sf http://127.0.0.1:7000/manifest.json > /dev/null
      - name: Emulator journey
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: APK="$(ls dist/*-universal.apk)" OUT=ci/out/e2e ADDON_LOG=ci/out/e2e/addon.log bash ci/e2e.sh
      - name: Publish ci-screens pre-release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          mkdir -p ci/out/e2e
          (cd ci/out/e2e && zip -q -r ../e2e-results.zip . || true)
          files=(ci/out/e2e/*.png ci/out/e2e/focus-trace.txt ci/out/e2e/logcat-app.txt ci/out/e2e/logcat.txt ci/out/e2e/addon.log ci/out/e2e-results.zip)
          existing=(); for f in "${files[@]}"; do [[ -f "$f" ]] && existing+=("$f"); done
          gh release delete ci-screens --yes --cleanup-tag 2>/dev/null || true
          gh release create ci-screens "${existing[@]}" \
            --prerelease --target "$GITHUB_SHA" --title "Emulator journey (${{ needs.build.outputs.version }})" \
            --notes "Screenshots, per-key focus trace and logcat from ci/e2e.sh on an Android TV API 34 emulator (tv_1080p)."

  showcase:
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[showcase]'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: apks
          path: dist
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Media and test add-on
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p ci/media ci/out/showcase
          ffmpeg -loglevel error -y -ss 0 -t 150 -i https://archive.org/download/BigBuckBunny_124/Content/big_buck_bunny_720p_surround.mp4 \
            -c copy -movflags +faststart ci/media/bbb-clip.mp4
          cp ci/media/bbb-clip.mp4 ci/media/sample-720p.mp4
          nohup python3 ci/test_addon.py > ci/out/showcase/addon.log 2>&1 &
          sleep 3 && curl -sf http://127.0.0.1:7000/manifest.json > /dev/null
      - name: Showcase journey
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: APK="$(ls dist/*-universal.apk)" OUT=ci/out/showcase bash ci/showcase.sh
      - name: Build README images
        run: |
          pip install --quiet pillow
          python docs/tools/make_images.py ci/out/showcase .
      - name: Publish ci-showcase pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ci-showcase --yes --cleanup-tag 2>/dev/null || true
          gh release create ci-showcase ci/out/showcase/*.png docs/images/banner.png docs/images/social-preview.png docs/images/screenshots/*.jpg \
            --prerelease --target "$GITHUB_SHA" --title "Showcase captures (${{ needs.build.outputs.version }})" \
            --notes "Real app, live catalogues, captured by ci/showcase.sh. Review before copying into docs/images."
