org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Branding and distribution. Override any of these with -P<name>=<value>.
vyrk.appName=VYRK
vyrk.applicationId=com.vyrk.tv
vyrk.versionName=0.1.0
vyrk.versionCode=1
# owner/repo checked for GitHub Releases by the in-app updater. Empty disables updates.
vyrk.updateRepo=MYKLHARU/vyrk-tv
# Suggested Top 10 add-on. Empty never suggests one.
vyrk.top10AddonUrl=https://7a82163c306e-stremio-netflix-catalog-addon.baby-beamup.club/manifest.json
# true builds an app-store flavour without REQUEST_INSTALL_PACKAGES or the updater UI.
vyrk.storeBuild=false
